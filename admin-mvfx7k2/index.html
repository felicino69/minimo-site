<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Reel Access — Admin</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px; }
  .admin-wrap h1 { margin: 0 0 8px; }
  #login-view, #manage-view { display: none; }
  #login-view.active, #manage-view.active { display: block; }
  .admin-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
    max-width: 360px;
  }
  .admin-form input {
    font-family: var(--font);
    font-size: 0.95rem;
    color: var(--text);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .admin-form input:focus { outline: none; border-color: var(--text-dim); }
  .admin-error { color: #f87171; font-size: 0.85rem; display: none; margin: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  th { color: var(--text-dim); font-weight: 500; }
  .del-btn {
    background: none;
    border: 1px solid var(--border);
    color: #f87171;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.8rem;
  }
  .del-btn:hover { border-color: #f87171; }
  .add-form { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; align-items: center; }
  .add-form input {
    font-family: var(--font);
    font-size: 0.9rem;
    color: var(--text);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    flex: 1 1 160px;
  }
  .empty-note { color: var(--text-dim); font-size: 0.9rem; }
</style>
</head>
<body>

<div class="admin-wrap">

  <div id="login-view">
    <h1>Reel Access — Admin</h1>
    <p class="section-sub">Enter the admin password to manage private reel access.</p>
    <form class="admin-form" id="login-form">
      <input type="password" id="admin-password-input" placeholder="Admin password" autocomplete="off" required>
      <button type="submit" class="btn-play">Log in</button>
      <p class="admin-error" id="login-error">Incorrect password.</p>
    </form>
  </div>

  <div id="manage-view">
    <h1>Private Reel Access</h1>
    <p class="section-sub">Anyone whose password appears here can unlock the private reel on the Reels page.</p>

    <div class="add-form">
      <input type="text" id="new-email" placeholder="Client email">
      <input type="text" id="new-password" placeholder="Password to give them">
      <input type="text" id="new-note" placeholder="Note (optional)">
      <button type="button" class="btn-play" id="add-btn">Add</button>
    </div>
    <p class="admin-error" id="add-error">Email and password are required.</p>

    <table id="entries-table">
      <thead>
        <tr><th>Email</th><th>Password</th><th>Note</th><th>Added</th><th></th></tr>
      </thead>
      <tbody id="entries-body"></tbody>
    </table>
    <p class="empty-note" id="empty-note" style="display:none;">No active passwords yet.</p>
  </div>

</div>

<script>
(() => {
  const loginView = document.getElementById('login-view');
  const manageView = document.getElementById('manage-view');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const adminPasswordInput = document.getElementById('admin-password-input');
  const entriesBody = document.getElementById('entries-body');
  const emptyNote = document.getElementById('empty-note');
  const addBtn = document.getElementById('add-btn');
  const addError = document.getElementById('add-error');

  function getAdminPassword() {
    return sessionStorage.getItem('minimo-admin-password');
  }

  function showLogin() {
    loginView.classList.add('active');
    manageView.classList.remove('active');
  }

  function showManage() {
    loginView.classList.remove('active');
    manageView.classList.add('active');
  }

  async function apiCall(method, body) {
    const res = await fetch('/.netlify/functions/admin', {
      method,
      headers: {
        'Content-Type': 'application/json',
        'x-admin-password': getAdminPassword() || '',
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.status === 401) {
      sessionStorage.removeItem('minimo-admin-password');
      showLogin();
      loginError.style.display = 'block';
      throw new Error('unauthorized');
    }
    return res.json();
  }

  function renderList(list) {
    entriesBody.innerHTML = '';
    emptyNote.style.display = list.length ? 'none' : 'block';
    list.forEach((entry) => {
      const tr = document.createElement('tr');
      const date = entry.createdAt ? new Date(entry.createdAt).toLocaleDateString() : '';
      tr.innerHTML = `
        <td>${entry.email}</td>
        <td>${entry.password}</td>
        <td>${entry.note || ''}</td>
        <td>${date}</td>
        <td><button class="del-btn" data-email="${entry.email}">Delete</button></td>
      `;
      entriesBody.appendChild(tr);
    });
    entriesBody.querySelectorAll('.del-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const data = await apiCall('DELETE', { email: btn.dataset.email });
        renderList(data.list);
      });
    });
  }

  async function loadList() {
    const data = await apiCall('GET');
    renderList(data.list);
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    sessionStorage.setItem('minimo-admin-password', adminPasswordInput.value);
    try {
      await loadList();
      loginError.style.display = 'none';
      showManage();
    } catch (err) {
      // 401 already handled in apiCall
    }
  });

  addBtn.addEventListener('click', async () => {
    const email = document.getElementById('new-email').value.trim();
    const password = document.getElementById('new-password').value.trim();
    const note = document.getElementById('new-note').value.trim();
    if (!email || !password) {
      addError.style.display = 'block';
      return;
    }
    addError.style.display = 'none';
    const data = await apiCall('POST', { email, password, note });
    renderList(data.list);
    document.getElementById('new-email').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-note').value = '';
  });

  // Auto-login if a password is already stored for this session
  if (getAdminPassword()) {
    loadList().then(showManage).catch(() => {});
  } else {
    showLogin();
  }
})();
</script>

</body>
</html>
